[project]
name = "anime-sama-downloader"
version = "0.1.0"
description = "A fast and efficient downloader for anime from Anime-Sama"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.14.2",
    "cloudscraper>=1.2.71",
    "colorama>=0.4.6",
    "flask>=3.1.2",
    "inquirerpy>=0.3.4",
    "lxml>=6.0.2",
    "rapidfuzz>=3.14.3",
    "requests>=2.32.5",
    "yt-dlp>=2025.11.12",
]
